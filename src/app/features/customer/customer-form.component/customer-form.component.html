<mat-horizontal-stepper linear class="stepper-container">

  <!-- STEP 1 -->
  <mat-step [stepControl]="userForm" label="User Info">
    <form [formGroup]="userForm">

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" />
        <mat-error>Name is required</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" />
        <mat-error>Valid email is required</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Phone</mat-label>
        <input matInput formControlName="phone" />
      </mat-form-field>

      <div class="actions">
        <button mat-raised-button color="primary"
          matStepperNext
          [disabled]="userForm.invalid">
          Continue
        </button>
      </div>

    </form>
  </mat-step>

  <!-- STEP 2 -->
  <mat-step [stepControl]="addressForm" label="Address">
    <form [formGroup]="addressForm">

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Street</mat-label>
        <input matInput formControlName="street" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>City</mat-label>
        <input matInput formControlName="city" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Country</mat-label>
        <input matInput formControlName="country" />
      </mat-form-field>

      <div class="actions">
        <button mat-button matStepperPrevious>Back</button>
        <button mat-raised-button color="primary"
          matStepperNext
          [disabled]="addressForm.invalid">
          Continue
        </button>
      </div>

    </form>
  </mat-step>

  <!-- STEP 3 -->
  <mat-step [stepControl]="paymentForm" label="Payment">
    <form [formGroup]="paymentForm">

      <mat-radio-group formControlName="paymentMethod" class="radio-group">
        <mat-radio-button [value]="paymentMethods.Card">
          Credit Card
        </mat-radio-button>
        <mat-radio-button [value]="paymentMethods.Deposit">
          Bank Deposit
        </mat-radio-button>
      </mat-radio-group>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Amount</mat-label>
        <input matInput type="number" formControlName="amount" />
        <mat-error>Amount must be greater than 0</mat-error>
      </mat-form-field>

      <mat-checkbox formControlName="authorized">
        I authorize the payment
      </mat-checkbox>

      <div class="actions">
        <button mat-button matStepperPrevious>Back</button>
        <button mat-raised-button color="accent"
          [disabled]="paymentForm.invalid || loading"
          (click)="submit()">
          Finish
        </button>
      </div>

    </form>
  </mat-step>

</mat-horizontal-stepper>
